<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Widow</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="images/cropped-favicon-32x32.png"
    />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <!--CSS Plugins-->
    <link rel="stylesheet" href="css/plugin.css" />
    <!-- Default CSS-->
    <link rel="stylesheet" href="css/default.css" />
    <!--Custom CSS-->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Font Awesome 4.7.0 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <!-- Font Awesome 5 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />

    <!-- Include lightGallery CSS -->
    <link

    />

    <style>
      body {
        background: #eef1f5;
        padding: 40px 0;
      }
      .form-card {
        max-width: 650px;
        margin: 10px auto;
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
      }
      .btn-primary {
        border-radius: 30px;
        padding: 10px 18px;
      }
    </style>
  </head>

  <body>
    <div id="site-header"></div>
    <div class="form-card">
      <h3 class="fw-bold text-center mb-2">Create New Widow</h3>
      <p class="text-muted text-center mb-4">
        Fill the details below to add widow information
      </p>

      <form id="widowForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Full Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Enter full name"
              required
            />
          </div>

          <!-- <div class="col-md-6 mb-3">
            <label class="fw-semibold">Age</label>
            <input
              type="number"
              id="age"
              class="form-control"
              placeholder="Enter age"
              required
            />
          </div> -->

          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Date of Birth</label>
            <input type="date" id="dob" class="form-control" max="" required />
          </div>

          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Age</label>
            <input
              type="text"
              id="calculatedAge"
              class="form-control"
              readonly
              placeholder="Age will be calculated automatically"
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Number of Children</label>
            <input
              type="number"
              id="childrenCount"
              class="form-control"
              placeholder="Enter number of children"
              required
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Location</label>
            <input
              type="text"
              id="location"
              class="form-control"
              placeholder="Enter location"
              required
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Description</label>
            <textarea
              id="description"
              class="form-control"
              rows="3"
              placeholder="Enter description"
              required
            ></textarea>
          </div>

          <div class="col-md-6 mb-3">
            <label class="fw-semibold">Upload Photo (optional)</label>
            <input
              type="file"
              id="image"
              class="form-control"
              accept="image/*"
            />
          </div>
        </div>
        <button
          type="submit"
          id="submitBtn"
          class="btn btn-primary w-100 mt-3"
          autocomplete="off"
        >
          <span id="btnText">Save Widow</span>
          <span
            id="btnSpinner"
            class="spinner-border spinner-border-sm ms-2 d-none"
            role="status"
            aria-hidden="true"
          ></span>
        </button>
      </form>
    </div>

    <!-- Success Modal -->
    <div
      class="modal fade"
      id="successModal"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="successModalLabel">
              <i class="fas fa-check-circle me-2"></i> Success
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body text-center py-4">
            <!-- <h5 class="mb-2">Orphan Created Successfully 🎉</h5> -->
            <p class="text-muted mb-0">The widow record saved successfully!.</p>
          </div>

          <div class="modal-footer justify-content-center">
            <button
              type="button"
              class="btn btn-success px-4"
              data-bs-dismiss="modal"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">
              <i class="fas fa-times-circle me-2"></i> Error
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body text-center">
            <p id="errorMessage" class="mb-0"></p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/config.js"></script>
    <script>
      const API_URL = window.API_BASE_URL;

      document
        .getElementById("widowForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = document.getElementById("submitBtn");
          const btnText = document.getElementById("btnText");
          const btnSpinner = document.getElementById("btnSpinner");

          // 🔒 Disable button + show spinner
          submitBtn.disabled = true;
          btnText.textContent = "Saving...";
          btnSpinner.classList.remove("d-none");

          const widowData = new FormData();

          widowData.append("name", document.getElementById("name").value);
          widowData.append("dob", document.getElementById("dob").value);
          widowData.append(
            "location",
            document.getElementById("location").value,
          );
          widowData.append(
            "numberOfChildren",
            document.getElementById("childrenCount").value,
          );
          widowData.append(
            "description",
            document.getElementById("description").value,
          );

          if (document.getElementById("image").files[0]) {
            widowData.append(
              "image",
              document.getElementById("image").files[0],
            );
          }

          try {
            const res = await fetch(`${API_URL}/widows`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
              body: widowData,
            });

            const data = await res.json();

            if (data.success) {
              const successModal = new bootstrap.Modal(
                document.getElementById("successModal"),
              );
              successModal.show();

              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 1500);
            } else {
              document.getElementById("errorMessage").textContent =
                data.message || "Error adding widow";
              const errorModal = new bootstrap.Modal(
                document.getElementById("errorModal"),
              );
              errorModal.show();
            }
          } catch (err) {
            document.getElementById("errorMessage").textContent =
              "Error adding widow";
            const errorModal = new bootstrap.Modal(
              document.getElementById("errorModal"),
            );
            errorModal.show();
          } finally {
            // 🔓 Re-enable button + restore text
            submitBtn.disabled = false;
            btnText.textContent = "Save Widow";
            btnSpinner.classList.add("d-none");
          }
        });

      //     age--;
      //   }

      //   document.getElementById("calculatedAge").value = age;

      const dobInput = document.getElementById("dob");
      const ageField = document.getElementById("calculatedAge");

      // Prevent future dates
      dobInput.max = new Date().toISOString().split("T")[0];

      dobInput.addEventListener("change", function () {
        if (!this.value) return;

        const dob = new Date(this.value);
        const today = new Date();

        let age = today.getFullYear() - dob.getFullYear();
        const monthDifference = today.getMonth() - dob.getMonth();

        if (
          monthDifference < 0 ||
          (monthDifference === 0 && today.getDate() < dob.getDate())
        ) {
          age--;
        }

        ageField.value = age >= 0 ? age : "";
      });

  </body>
</html>
