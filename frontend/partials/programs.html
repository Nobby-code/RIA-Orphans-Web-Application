<h4 class="mb-3">Programs Management</h4>

<div class="card shadow-sm mb-4">
  <div class="card-header">
    <strong>Create New Program</strong>
  </div>

  <div class="card-body">
    <form id="createProgramForm">
      <div class="mb-3">
        <label for="programTitle" class="form-label"> Program Name </label>
        <input
          type="text"
          class="form-control"
          id="programTitle"
          name="title"
          placeholder="e.g. Education Support Program"
          required
        />
      </div>

      <div class="mb-3">
        <label for="programDescription" class="form-label"> Description </label>
        <textarea
          class="form-control"
          id="programDescription"
          name="description"
          rows="3"
          placeholder="Describe the purpose of this program"
        ></textarea>
      </div>

      <!-- Program Image -->
      <div class="mb-3">
        <label for="programImage" class="form-label"> Program Image </label>

        <input
          type="file"
          class="form-control"
          id="programImage"
          name="image"
          accept="image/jpeg,image/png,image/webp"
        />

        <div class="form-text">
          Select a JPG, PNG, or WebP image. An image is optional.
        </div>

        <div class="mt-3 d-none" id="programImagePreviewWrapper">
          <img
            id="programImagePreview"
            src=""
            alt="Selected program image preview"
            class="img-thumbnail"
            style="max-width: 260px; max-height: 180px; object-fit: cover"
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="programStartDate" class="form-label"> Start Date </label>
          <input
            type="date"
            class="form-control"
            id="programStartDate"
            name="startDate"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label for="programEndDate" class="form-label"> End Date </label>
          <input
            type="date"
            class="form-control"
            id="programEndDate"
            name="endDate"
          />
        </div>
      </div>

      <div id="createProgramMessage" class="mb-3" role="alert"></div>

      <button type="submit" id="createProgramButton" class="btn btn-primary">
        Save Program
      </button>

      <button type="reset" class="btn btn-secondary">Clear</button>
    </form>
  </div>
</div>

<h4 class="mb-3">Programs List</h4>

<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Description</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="programsTableBody">
      <tr>
        <td colspan="7" class="text-center">Loading programs...</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Edit Program Modal -->
<div
  class="modal fade"
  id="editProgramModal"
  tabindex="-1"
  aria-labelledby="editProgramModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <form id="editProgramForm">
        <div class="modal-header">
          <h5 class="modal-title" id="editProgramModalLabel">Edit Program</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="editProgramId" />

          <div id="editProgramMessage" class="alert d-none" role="alert"></div>

          <div class="mb-3">
            <label for="editProgramTitle" class="form-label">
              Program Name
            </label>
            <input
              type="text"
              class="form-control"
              id="editProgramTitle"
              required
            />
          </div>

          <div class="mb-3">
            <label for="editProgramDescription" class="form-label">
              Description
            </label>
            <textarea
              class="form-control"
              id="editProgramDescription"
              rows="3"
            ></textarea>
          </div>

          <!-- Edit Program Image -->
          <div class="mb-3">
            <label for="editProgramImage" class="form-label">
              Program Image
            </label>

            <input
              type="file"
              class="form-control"
              id="editProgramImage"
              name="image"
              accept="image/jpeg,image/png,image/webp"
            />

            <div class="form-text">
              Leave this empty to keep the current image.
            </div>

            <div class="mt-3 d-none" id="editProgramImagePreviewWrapper">
              <img
                id="editProgramImagePreview"
                src=""
                alt="Current or selected program image"
                class="img-thumbnail"
                style="max-width: 260px; max-height: 180px; object-fit: cover"
              />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="editProgramStartDate" class="form-label">
                Start Date
              </label>
              <input
                type="date"
                class="form-control"
                id="editProgramStartDate"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label for="editProgramEndDate" class="form-label">
                End Date
              </label>
              <input type="date" class="form-control" id="editProgramEndDate" />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="saveProgramChanges">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
