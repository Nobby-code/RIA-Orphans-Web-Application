<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Events</h5>
    <a href="create-event.html" class="btn btn-primary btn-sm">
      <i class="fas fa-plus"></i> Add Event
    </a>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Description</th>
            <th>Location</th>
            <th>Event Date</th>
            <th>Program</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <tr>
            <td colspan="7" class="text-center">Loading events...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>


<!-- Edit Event Modal -->
<div class="modal fade" id="editEventModal" tabindex="-1"
     aria-labelledby="editEventModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <form id="editEventForm">
        <div class="modal-header">
          <h5 class="modal-title" id="editEventModalLabel">Edit Event</h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="editEventId">

          <div class="mb-3">
            <label for="editEventTitle" class="form-label">Event Title</label>
            <input type="text" id="editEventTitle" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="editEventDescription" class="form-label">Description</label>
            <textarea id="editEventDescription" class="form-control"
                      rows="4" required></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="editEventDate" class="form-label">Event Date</label>
              <input type="date" id="editEventDate" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="editEventLocation" class="form-label">Location</label>
              <input type="text" id="editEventLocation" class="form-control">
            </div>
          </div>

          <div class="mb-3">
            <label for="editEventProgram" class="form-label">Related Program</label>
            <select id="editEventProgram" class="form-select">
              <option value="">No program selected</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="editEventImage" class="form-label">Replace Image (optional)</label>
            <input type="file" id="editEventImage" class="form-control"
                   accept="image/*">
            <small class="text-muted">
              Leave this blank to keep the current image.
            </small>
          </div>

          <div id="editEventError" class="alert alert-danger d-none"
               role="alert"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">Cancel</button>
          <button type="submit" id="saveEventChanges"
                  class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
