<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Causes Detail - Ria Orphans Foundation</title>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="images/cropped-favicon-32x32.png"
    />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <!--CSS Plugins-->
    <link rel="stylesheet" href="css/plugin.css" />
    <!-- Default CSS-->
    <link rel="stylesheet" href="css/default.css" />
    <!--Custom CSS-->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Font Awesome 4.7.0 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <!-- Font Awesome 5 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />

    <!-- Include lightGallery CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lightgallery/css/lightgallery-bundle.min.css"
    />
  </head>
  <body>
    <!-- Header Section Start -->
    <div id="site-header"></div>
    <!-- Header Section End -->

    <!-- Breadcrumb Section Starts -->
    <section class="breadcrumb position-relative mb-0">
      <div class="overlay"></div>
      <div
        class="container text-center position-absolute top-50 start-50 translate-middle"
      >
        <div class="breadcrumb-inner">
          <h2 class="white mb-0">Events List</h2>
        </div>
      </div>
    </section>
    <!-- Breadcrumb Section Ends -->

    <!-- Event Section Start -->
    <section class="py-5">
      <div class="container">
        <div class="mb-4">
          <a href="event-list.html" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-2"></i>
            Back to Events
          </a>
        </div>

        <div id="eventDetailMessage" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading event...</span>
          </div>
          <p class="text-muted mt-3">Loading event details...</p>
        </div>

        <div id="eventDetailContainer"></div>
      </div>
    </section>
    <!-- Event Section End -->

    <!-- Involvement Banner Starts -->
    <section class="involvement-banner py-5">
      <div class="container">
        <div class="involvement-banner-inner text-center text-lg-start">
          <div class="row align-items-center gy-4">
            <div class="col-lg-8">
              <div class="involvement-banner-left">
                <ul
                  class="list-unstyled d-flex flex-column flex-lg-row align-items-center gap-4"
                >
                  <li>
                    <span
                      class="bg-white rounded-circle d-flex align-items-center justify-content-center"
                      ><img
                        src="images/handshake.png"
                        alt="handshake icon"
                        class=""
                    /></span>
                  </li>
                  <li>
                    <h3 class="mb-0 white">
                      Best Way ot Make a Difference in the Lives of Others
                    </h3>
                  </li>
                </ul>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="involvement-banner-right text-lg-end">
                <a href="contact.html" class="btn-primary">Get Involved Now</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Involvement Banner Starts -->

    <!-- Footer Starts -->
    <div id="site-footer"></div>
    <!-- Footer Ends -->

    <script src="js/config.js"></script>
    <script src="js/event-detail.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/plugin.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sticky.js"></script>
    <script src="js/event-list.js"></script>
  </body>
</html>
