<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Event</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Header Section Start -->
    <div id="site-header"></div>
    <!-- Header Section End -->
    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-4">Create Event</h4>

          <form id="eventForm">
            <div class="mb-3">
              <label class="form-label">Event Title</label>
              <input type="text" id="title" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea
                id="description"
                class="form-control"
                rows="4"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Event Date</label>
              <input type="date" id="eventDate" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Location</label>
              <input type="text" id="location" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="program" class="form-label"
                >Related Program (Optional)</label
              >
              <select id="program" class="form-select">
                <option value="">No program selected</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Event Image</label>
              <input
                type="file"
                id="image"
                class="form-control"
                accept="image/*"
              />
            </div>

            <button id="submitBtn" class="btn btn-primary w-100" type="submit">
              Add Event
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center">
            <h5 class="text-success">Success 🎉</h5>
            <p id="successMessage"></p>
            <button class="btn btn-success mt-2" data-bs-dismiss="modal">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script>
      console.log("API BASE URL:", window.API_BASE_URL);
    </script>

    <!-- Bootstrap JS (IMPORTANT) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const API_URL = window.API_BASE_URL;

      const form = document.getElementById("eventForm");
      const submitBtn = document.getElementById("submitBtn");
      const programSelect = document.getElementById("program");
      const successModalElement = document.getElementById("successModal");

      // Load existing programs into the dropdown
      async function loadPrograms() {
        try {
          const response = await fetch(`${API_URL}/programs`, {
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Could not load programs.");
          }

          const programs = result.data || [];

          programSelect.innerHTML =
            '<option value="">No program selected</option>';

          programs.forEach((program) => {
            const option = document.createElement("option");
            option.value = program._id;
            option.textContent = program.title;
            programSelect.appendChild(option);
          });
        } catch (error) {
          console.error("Load programs error:", error);
        }
      }

      // Load programs when the page opens
      loadPrograms();

      // Handle event creation
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!API_URL) {
          alert("API URL is not configured. Check js/config.js.");
          return;
        }

        const originalButtonText = "Add Event";

        submitBtn.disabled = true;
        submitBtn.textContent = "Adding event...";

        const formData = new FormData();

        formData.append("title", document.getElementById("title").value.trim());
        formData.append(
          "description",
          document.getElementById("description").value.trim(),
        );
        formData.append(
          "location",
          document.getElementById("location").value.trim(),
        );
        formData.append(
          "eventDate",
          document.getElementById("eventDate").value,
        );

        if (programSelect.value) {
          formData.append("program", programSelect.value);
        }

        const imageFile = document.getElementById("image").files[0];

        if (imageFile) {
          formData.append("image", imageFile);
        }

        try {
          const response = await fetch(`${API_URL}/events`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${localStorage.getItem("token")}`,
            },
            body: formData,
          });

          const result = await response.json();

          if (!response.ok || result.success === false) {
            throw new Error(result.message || "Failed to create event.");
          }

          document.getElementById("successMessage").textContent =
            result.message || "Event created successfully.";

          bootstrap.Modal.getOrCreateInstance(successModalElement).show();

          form.reset();

          // Refresh the program dropdown in case programs have changed
          await loadPrograms();
        } catch (error) {
          console.error("Create event error:", error);
          alert(error.message || "An error occurred while creating the event.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalButtonText;
        }
      });
    </script>
  </body>
</html>
